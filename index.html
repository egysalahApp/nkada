<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تدريبات كاد وأخواتها - العربية السهلة</title>
    
    <!-- استدعاء خط نوتو نسخ العربي من جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة Tailwind CSS لتسريع التصميم المتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Noto Naskh Arabic', serif;
            background-color: #ffffff;
            color: #1f2937;
        }
        
        .btn-option {
            transition: all 0.3s ease;
        }
        
        .btn-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .correct-answer {
            background-color: #10b981 !important; /* أخضر */
            color: white !important;
            border-color: #10b981 !important;
        }

        .wrong-answer {
            background-color: #ef4444 !important; /* أحمر */
            color: white !important;
            border-color: #ef4444 !important;
        }

        .disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        #feedback-box {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8">

    <!-- شريط العنوان والهوية -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center pb-4 border-b-2 border-gray-100 mb-8 gap-4">
        <div class="text-center sm:text-right">
            <h1 class="text-2xl font-bold text-blue-700">إعداد/ محمود صلاح</h1>
        </div>
        
        <a href="https://www.youtube.com/egysalah" target="_blank" class="flex items-center gap-2 bg-red-50 hover:bg-red-100 px-4 py-2 rounded-full transition duration-300 group">
            <span class="text-red-600 font-bold text-lg group-hover:text-red-700">العربية السهلة</span>
            <!-- أيقونة يوتيوب SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#ff0000" class="group-hover:scale-110 transition-transform">
                <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
            </svg>
        </a>
    </header>

    <!-- الحاوية الرئيسية للتطبيق -->
    <main class="w-full max-w-3xl bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden relative">
        
        <!-- شاشة البداية -->
        <div id="start-screen" class="p-8 text-center flex flex-col items-center">
            <!-- أيقونة تعبيرية SVG -->
            <svg class="w-32 h-32 mb-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
            <h2 class="text-4xl font-bold text-gray-800 mb-4">تدريبات: كاد وأخواتها</h2>
            <p class="text-xl text-gray-600 mb-8 leading-relaxed">
                أهلاً بك في هذا التدريب التفاعلي. سنختبر معلوماتك حول أفعال المقاربة والرجاء والشروع، وحكم اقتران خبرها بـ (أن)، والتمييز بين الأفعال الناقصة والتامة.
            </p>
            <button onclick="startQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-2xl py-4 px-12 rounded-xl shadow-lg transition transform hover:scale-105">
                ابدأ التدريب الآن
            </button>
        </div>

        <!-- شاشة التدريب -->
        <div id="quiz-screen" class="hidden flex flex-col min-h-[500px]">
            <!-- شريط التقدم -->
            <div class="bg-gray-100 h-2 w-full">
                <div id="progress-bar" class="bg-blue-600 h-2 transition-all duration-500" style="width: 0%"></div>
            </div>
            
            <div class="p-6 sm:p-10 flex-grow flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-gray-500 text-lg font-semibold" id="question-counter">السؤال 1 من 10</span>
                        <span class="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full" id="score-display">النقاط: 0</span>
                    </div>
                    
                    <h3 id="question-text" class="text-2xl sm:text-3xl font-bold text-gray-800 mb-8 leading-normal text-center"></h3>
                    
                    <div id="options-container" class="flex flex-col gap-4">
                        <!-- الأزرار ستضاف هنا عبر الجافاسكربت -->
                    </div>
                </div>

                <!-- صندوق التغذية الراجعة (إجابة صحيحة / إجابة خاطئة) -->
                <div id="feedback-box" class="mt-8 p-4 rounded-xl text-center text-xl font-bold opacity-0 hidden">
                </div>

                <div class="mt-6 flex justify-end">
                    <button id="next-btn" onclick="nextQuestion()" class="hidden bg-gray-800 hover:bg-gray-900 text-white font-bold text-xl py-3 px-8 rounded-xl transition">
                        السؤال التالي ←
                    </button>
                </div>
            </div>
        </div>

        <!-- شاشة النتيجة النهائية -->
        <div id="result-screen" class="hidden p-8 sm:p-12 text-center flex flex-col items-center">
            <div id="result-icon" class="mb-6"></div>
            <h2 class="text-4xl font-bold text-gray-800 mb-4">انتهى التدريب!</h2>
            <p class="text-2xl text-gray-600 mb-6">لقد حصلت على:</p>
            <div class="text-6xl font-bold text-blue-600 mb-8" id="final-score">10 / 10</div>
            <p id="result-message" class="text-2xl font-bold mb-8"></p>
            <button onclick="resetQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-2xl py-4 px-12 rounded-xl shadow-lg transition transform hover:scale-105">
                إعادة التدريب
            </button>
        </div>

    </main>

    <script>
        // بنك الأسئلة
        const questions = [
            {
                question: "الفعل (عَسَى) يُعد من أفعال:",
                options: ["المقاربة", "الرجاء", "الشروع"],
                correct: 1
            },
            {
                question: "لكي تكون (كاد وأخواتها) أفعالًا ناقصة، لابد أن يكون خبرها:",
                options: ["مفردًا منصوبًا", "شبه جملة", "جملة فعلية فعلها مضارع"],
                correct: 2
            },
            {
                question: "«كاد العربُ ينتصرون». الموقع الإعرابي لجملة (ينتصرون):",
                options: ["في محل رفع خبر كاد", "في محل نصب خبر كاد", "في محل جزم"],
                correct: 1
            },
            {
                question: "من أفعال الشروع التي تدل على البدء في الخبر:",
                options: ["أوشك، كرب", "حرى، اخلولق", "شرع، طفق، أخذ"],
                correct: 2
            },
            {
                question: "حكم اقتران خبر أفعال الشروع (مثل: بدأ، شرع) بـ (أنْ):",
                options: ["ممنوع (لا يقترن)", "يجوز", "يجب"],
                correct: 0
            },
            {
                question: "«أخذ الطالبُ يذاكر درسَه». إعراب كلمة (الطالبُ):",
                options: ["فاعل مرفوع", "اسم أخذ مرفوع", "مبتدأ مرفوع"],
                correct: 1
            },
            {
                question: "«أخذ الطالبُ الكتابَ من المعلم». إعراب كلمة (الطالبُ):",
                options: ["فاعل مرفوع", "اسم أخذ مرفوع", "مفعول به"],
                correct: 0
            },
            {
                question: "أفعال الشروع لا يقترن خبرها بـ (أن).",
                options: ["صواب", "خطأ"],
                correct: 0
            },
            {
                question: "الجملة الصحيحة نحويًا هي:",
                options: ["شرع المهندسون أن يبنوا", "شرع المهندسون يبنون", "شرع المهندسين يبنون"],
                correct: 1
            },
            {
                question: "«أوشك السلامُ ...» التكملة الصحيحة (ويكثر اقترانها بـ أن):",
                options: ["يعمُّ", "أن يعمَّ", "أن يعمُّ"],
                correct: 1
            },
            {
                question: "الأفعال التي يأتي منها المضارع من (كاد وأخواتها) هي:",
                options: ["كاد وأوشك فقط", "عسى وحرى فقط", "جميع أفعال الشروع"],
                correct: 0
            },
            {
                question: "«عسى اللهُ أن يأتي بالنصر». حكم اقتران خبر (عسى) بـ (أنْ):",
                options: ["يجب", "يكثر", "يقل", "يمتنع (لا يقترن)"],
                correct: 1
            },
            {
                question: "الجملة التي تشتمل على فعل (تام) هي:",
                options: ["أنشأ المهندسون يبنون", "بدأ الطالبُ يقرأ", "أنشأ المهندسون المبنى"],
                correct: 2
            },
            {
                question: "«يكاد اللاعبون يفوزون». الفعل (يكاد) هنا:",
                options: ["فعل مضارع تام", "فعل مضارع ناقص", "فعل ماضٍ ناقص"],
                correct: 1
            },
            {
                question: "أي الجمل التالية صحيحة نحويًا؟",
                options: ["عسى الكربُ ينفرجُ", "عسى الكربُ أن ينفرجَ", "كلاهما صواب"],
                correct: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // عناصر واجهة المستخدم
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionCounter = document.getElementById('question-counter');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const feedbackBox = document.getElementById('feedback-box');
        const nextBtn = document.getElementById('next-btn');

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            // إعادة ضبط الحالة
            nextBtn.classList.add('hidden');
            feedbackBox.classList.add('hidden');
            feedbackBox.style.opacity = '0';
            feedbackBox.className = 'mt-8 p-4 rounded-xl text-center text-xl font-bold'; // إعادة الفئات الأساسية
            optionsContainer.innerHTML = '';
            
            const currentQ = questions[currentQuestionIndex];
            
            // تحديث النصوص
            questionText.textContent = currentQ.question;
            questionCounter.textContent = `السؤال ${currentQuestionIndex + 1} من ${questions.length}`;
            scoreDisplay.textContent = `النقاط: ${score}`;
            
            // تحديث شريط التقدم
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            // إنشاء الخيارات
            currentQ.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.className = 'btn-option w-full text-right sm:text-center bg-gray-50 border-2 border-gray-200 text-gray-800 text-xl font-semibold py-4 px-6 rounded-xl hover:bg-blue-50 hover:border-blue-300';
                button.onclick = () => checkAnswer(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex, selectedButton) {
            const currentQ = questions[currentQuestionIndex];
            const allButtons = optionsContainer.querySelectorAll('button');
            
            // تعطيل جميع الأزرار بعد الاختيار
            allButtons.forEach(btn => btn.classList.add('disabled'));

            feedbackBox.classList.remove('hidden');
            
            if (selectedIndex === currentQ.correct) {
                // إجابة صحيحة
                selectedButton.classList.add('correct-answer');
                score++;
                scoreDisplay.textContent = `النقاط: ${score}`;
                
                feedbackBox.textContent = "إجابة صحيحة";
                feedbackBox.classList.add('bg-green-100', 'text-green-800');
            } else {
                // إجابة خاطئة
                selectedButton.classList.add('wrong-answer');
                // تظليل الإجابة الصحيحة
                allButtons[currentQ.correct].classList.add('correct-answer');
                
                feedbackBox.textContent = "إجابة خاطئة";
                feedbackBox.classList.add('bg-red-100', 'text-red-800');
            }

            // إظهار التغذية الراجعة وزر التالي بتأثير حركي
            setTimeout(() => {
                feedbackBox.style.opacity = '1';
                nextBtn.classList.remove('hidden');
            }, 100);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
            
            const resultMessage = document.getElementById('result-message');
            const resultIcon = document.getElementById('result-icon');
            
            const percentage = (score / questions.length) * 100;
            
            if (percentage >= 90) {
                resultMessage.textContent = "ممتاز! أنت متفوق في قواعد اللغة العربية.";
                resultMessage.className = "text-2xl font-bold mb-8 text-green-600";
                resultIcon.innerHTML = `<svg class="w-32 h-32 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>`;
            } else if (percentage >= 60) {
                resultMessage.textContent = "جيد جدًا! يمكنك مراجعة الدرس لتحقيق العلامة الكاملة.";
                resultMessage.className = "text-2xl font-bold mb-8 text-blue-600";
                resultIcon.innerHTML = `<svg class="w-32 h-32 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.514"></path></svg>`;
            } else {
                resultMessage.textContent = "تحتاج إلى مراجعة الدرس مرة أخرى، لا تستسلم!";
                resultMessage.className = "text-2xl font-bold mb-8 text-orange-500";
                resultIcon.innerHTML = `<svg class="w-32 h-32 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`;
            }
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
